name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # El TFM es net8.0, pero AstroPlanner.slnx necesita un SDK reciente.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compilar
        run: dotnet build AstroPlanner.slnx -c Release

      - name: Pruebas
        run: dotnet test AstroPlanner.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  release:
    # Solo al publicar un tag de versión, p. ej. v0.4.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publicar .exe autocontenido
        run: >
          dotnet publish AstroPlanner.UI -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -o publish

      - name: Empaquetar
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path publish\AstroPlanner.UI.exe -DestinationPath "AstroPlanner_${version}_win-x64.zip"

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: AstroPlanner_*_win-x64.zip
          draft: true
          generate_release_notes: true
